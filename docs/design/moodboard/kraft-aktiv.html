<!--
  Laufendes Krafttraining (Stil C "Abend im Dojo"). Fokus: aktuelle Übung und nächster Satz groß, der Rest ruhig.
  Die Tab-Leiste ist während des Trainings ausgeblendet. Der Knopf "Verkleinern" oben links bringt dich zurück in die App; das Training läuft weiter und erscheint dort als Karte "Training läuft" (heute: kraft-training-offen-karte).
  Wohin die heutigen Funktionen gewandert sind:
  - Satz-Tabelle (Satz, kg, Wdh, Haken je Satz): der nächste Satz steht groß in der Fokuskarte mit kg und Wdh als Knöpfe (antippen = Zahl ändern wie heute beim Tippen ins Feld) und dem Hauptknopf "Satz geschafft". Alle Sätze stehen darunter als kleine Kreise; antippen öffnet den Satz zum Nachtragen oder Ändern.
  - Aufwärmsatz ("Aufw."): erster kleiner Kreis "A".
  - "Zuletzt 57,5 kg × 8, 8, 8, 7": eine Zeile in der Fokuskarte ("Letztes Mal …").
  - "Scheiben je Seite": kleine Zeile unter den Zahlen.
  - Pause mit "+30 s": eigene ruhige Karte über der Fokuskarte, nur solange eine Pause läuft.
  - Übungs-Info (i): Knopf "Anleitung" in der Fokuskarte.
  - Übungs-Menü (…: Sätze bearbeiten, Supersatz mit, Reihenfolge ändern, Entfernen): Knopf "Mehr" in der Fokuskarte, öffnet dasselbe Sheet.
  - Übung auf-/zuklappen und andere Übungen: Liste "DANACH" mit ruhigen Zeilen; antippen macht die Übung zur aktuellen. Supersätze stehen als ein Paar in einer Zeile.
  - Erledigte Übungen: eine Zeile "Geschafft" im Orientierungskopf, Details per Antippen.
  - Kopf-Menü (…: Läuft seit, Studio wechseln, Bo fragen, Training beenden, Training verwerfen): runder Knopf "…" oben rechts; "Läuft seit 39 Minuten" steht zusätzlich offen im Kopf.
  - "Übung hinzufügen" (Sheet "Übung wählen" mit Suche, zuletzt benutzt, Muskelgruppen): ruhiger Knopf unten.
  - "Training beenden": Rahmenknopf ganz unten. Sind Sätze offen, kommt das Sheet "X Sätze sind noch offen" (nicht eintragen / trotzdem eintragen / zurück) wie heute.
  - Danach "Gespeichert / Zum Abschluss": wird zu einer Abschlusskarte im Kraft-Tab mit Bo-Sprechblase (Dehn-Hinweis) und Knopf "Fertig".
-->
