# Pandafit web server. Own Tailscale node with Funnel on 443; the API listens only on 127.0.0.1 of the host.
# Variables via Compose interpolation from ./.env (chmod 600). No env_file, so that api does not see the Tailscale key.
# Build context is the repo root: run from this folder, `docker compose build`.
name: pandafit

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ..
      dockerfile: web-server/Dockerfile
    image: pandafit-api:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      PANDAFIT_DB: /data/pandafit.db
      PANDAFIT_STATIC: /app/out/web
      PANDAFIT_TRUST_PROXY_CIDR: ${PANDAFIT_TRUST_PROXY_CIDR:-172.16.0.0/12}
      # Web Push: VAPID subject (mailto: or https:); empty means the public origin. PANDAFIT_PUSH=off sends nothing.
      PANDAFIT_PUSH_SUBJECT: ${PANDAFIT_PUSH_SUBJECT:-}
      PANDAFIT_PUSH: ${PANDAFIT_PUSH:-on}
      # Coach: the api forwards /coach requests to it. Its internal listener (8081) is never published, but it listens on all interfaces
      # of the api container, so web-server/internal.ts checks the sender: only addresses the name in PANDAFIT_INTERNAL_PEER resolves to.
      PANDAFIT_COACH_URL: http://coach:8090
      # The internal listener (8081) answers only the addresses the name `coach` resolves to.
      PANDAFIT_INTERNAL_PEER: coach
      PANDAFIT_INTERNAL_TOKEN: ${PANDAFIT_INTERNAL_TOKEN:?set PANDAFIT_INTERNAL_TOKEN in .env (openssl rand -hex 32)}
    networks: [default, internal]
    ports:
      - "127.0.0.1:${PANDAFIT_PORT:-7004}:8080"
    volumes:
      - data:/data
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  coach:
    # The coach: Claude, Hevy and Garmin for every profile. No published port; only api shares a network with it (internal).
    # Garmin and Hevy secrets are sealed with PANDAFIT_SECRET_KEY (only here). The Claude login lives in /data/home (volume, never in a backup).
    build:
      context: ..
      dockerfile: web-server/Dockerfile.coach
    image: pandafit-coach:local
    restart: unless-stopped
    logging: *default-logging
    environment:
      PANDAFIT_SECRET_KEY: ${PANDAFIT_SECRET_KEY:?set PANDAFIT_SECRET_KEY in .env (openssl rand -hex 32)}
      PANDAFIT_INTERNAL_TOKEN: ${PANDAFIT_INTERNAL_TOKEN:?set PANDAFIT_INTERNAL_TOKEN in .env (openssl rand -hex 32)}
      # Claude runs in the home server's AI service (heimserver ki/README.md); empty = the local claude as before.
      PANDAFIT_AI_URL: ${PANDAFIT_AI_URL:-}
      PANDAFIT_AI_TOKEN: ${PANDAFIT_AI_TOKEN:-}
      # Weekly overview by email through the home server's mail service (heimserver mail/). Mail is off while MAIL_TOKEN is empty.
      # The token lives only in .env, never in the repo.
      MAIL_URL: http://homeserver-mail:8080
      MAIL_TOKEN: ${PANDAFIT_MAIL_TOKEN:-}
      PANDAFIT_APP_URL: ${PANDAFIT_APP_URL:-}
      TZ: ${TZ:-UTC}
    # internal: shared with api, no way out. coach-egress: the coach's own way out to Hevy and Garmin; no other service joins it,
    # so tailscale (on default) cannot reach the coach. homeserver-ai, homeserver-mail: internal networks of the shared AI and mail services, no way out.
    networks: [internal, coach-egress, homeserver-ai, homeserver-mail]
    volumes:
      - coach:/data
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=0700
      - /run/pandafit-secrets:uid=1000,gid=1000,mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tailscale:
    # Own Tailscale node, no host port. Userspace mode: no /dev/net/tun, no NET_ADMIN, all capabilities dropped.
    # Version pinned; raise it deliberately after reading the release notes.
    image: tailscale/tailscale:v1.104.4
    restart: unless-stopped
    logging: *default-logging
    hostname: pandafit
    environment:
      TS_HOSTNAME: pandafit
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      - api
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # State lives on the named volume; the socket and scratch files go to tmpfs.
    # If the sidecar does not come up on the server, loosen in this order and note it in SERVER.md:
    # drop read_only first, then add `cap_add: [NET_BIND_SERVICE]`; never add NET_ADMIN or /dev/net/tun (userspace mode needs neither).
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD-SHELL", "tailscale --socket=/tmp/tailscaled.sock status >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  internal:
    internal: true
  coach-egress: {}
  homeserver-ai:
    external: true
    name: homeserver-ai-pandafit # eigenes Netz je App: die Apps sehen nur den Dienst, nicht einander (heimserver ki/README.md)
  homeserver-mail:
    external: true
    name: homeserver-mail-pandafit # eigenes Netz je App: die Apps sehen nur den Dienst, nicht einander (heimserver ki/README.md)

volumes:
  coach:
    name: pandafit_coach
  data:
    name: pandafit_data
  tsstate:
    name: pandafit_tsstate
